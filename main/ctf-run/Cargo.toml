[package]
name = "ctf-run"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"

# `--features tls` adds https:// support for the external API (rustls with bundled Mozilla roots); the
# CourseStack proxy is plain http and needs none of it. `ring` (already rustls's crypto provider) supplies
# SHA-256: its BoringSSL assembly is ~2x the portable Rust hash on the jumpbox (no SHA-NI there).

[features]
tls = ["dep:rustls", "dep:webpki-roots"]

[dependencies]
ring = "0.17"
# Pure-Rust zstd decoder (no C in the static musl build): Cloudflare serves the big JSON bodies as zstd.
ruzstd = "0.8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
webpki-roots = { version = "1", optional = true }

# The static musl build (flake `.#ctf-run`, deployed to the jumpbox) needs a real allocator: musl's malloc made
# script/binary-RE analysis 40-70 % slower there.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.test]
opt-level = 2
